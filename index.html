
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>AI VISION - Intelligence artificielle</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 24px 0;
    }

    .logo {
      font-size: 36px;
      font-weight: bold;
      color: #60a5fa;
    }

    header p { color: #aab8cc; }

    .panel {
      background: #1c293c;
      padding: 22px;
      border-radius: 18px;
      margin-top: 20px;
    }

    h2 { font-size: 19px; }

    input[type="file"] {
      width: 100%;
      padding: 14px;
      background: #26364d;
      border-radius: 10px;
      color: white;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 380px;
      object-fit: contain;
      margin-top: 18px;
      border-radius: 12px;
      background: #111;
    }

    #status {
      color: #93c5fd;
      text-align: center;
      margin-top: 16px;
    }

    .result {
      background: #26364d;
      padding: 14px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .empty {
      color: #aab8cc;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #8292a8;
      margin: 30px 0 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="logo">AI VISION</div>
      <p>Votre intelligence artificielle de reconnaissance visuelle</p>
    </header>

    <section class="panel">
      <h2>Analysez une image</h2>
      <p>Sélectionnez une photo depuis votre téléphone.</p>

      <input type="file" id="imageInput" accept="image/*">

      <img id="preview" alt="Image à analyser">

      <button id="analyzeBtn" disabled>
        Analyser l'image
      </button>

      <p id="status">En attente d'une image...</p>
    </section>

    <section class="panel">
      <h2>Résultats de l'analyse</h2>
      <div id="results" class="empty">
        Les objets détectés apparaîtront ici.
      </div>
    </section>

    <footer>
      AI VISION — Projet open source de vision par ordinateur.
    </footer>
  </main>

  <script>
    const input = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const button = document.getElementById("analyzeBtn");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    let model = null;

    input.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        status.textContent = "Veuillez choisir une image.";
        return;
      }

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      button.disabled = false;
      results.innerHTML = "Prêt pour l'analyse.";
      status.textContent = "Image chargée avec succès.";
    });

    button.addEventListener("click", async function () {
      try {
        button.disabled = true;
        status.textContent = "Chargement de l'intelligence artificielle...";

        if (!model) {
          await tf.ready();
          model = await cocoSsd.load();
        }

        status.textContent = "Analyse de l'image en cours...";

        const predictions = await model.detect(preview);

        results.innerHTML = "";

        if (predictions.length === 0) {
          results.innerHTML =
            '<p class="empty">Aucun objet reconnu.</p>';
        } else {
          predictions.forEach(item => {
            const confidence =
              (item.score * 100).toFixed(1);

            const card = document.createElement("div");
            card.className = "result";

            const name = document.createElement("strong");
            name.textContent = item.class;

            const score = document.createElement("p");
            score.textContent =
              "Confiance : " + confidence + "%";

            card.appendChild(name);
            card.appendChild(score);
            results.appendChild(card);
          });
        }

        status.textContent =
          predictions.length + " détection(s) terminée(s).";

      } catch (error) {
        status.textContent =
          "Erreur : vérifiez votre connexion Internet et réessayez.";
        console.error(error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
  </html>
